    <rect x="101" y="1182" width="310" height="145" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="256" y="1248" class="base heavy" font-size="31">10:00</text>
    <text x="256" y="1291" class="green heavy" font-size="24">DISPONIBLE</text>

    <rect x="440" y="1182" width="310" height="145" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="595" y="1248" class="base heavy" font-size="31">10:30</text>
    <text x="595" y="1291" class="green heavy" font-size="24">DISPONIBLE</text>

    <rect x="101" y="1355" width="310" height="145" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="256" y="1421" class="base heavy" font-size="31">11:00</text>
    <text x="256" y="1464" class="green heavy" font-size="24">DISPONIBLE</text>

    <rect x="440" y="1355" width="310" height="145" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="595" y="1421" class="base heavy" font-size="31">11:30</text>
    <text x="595" y="1464" class="green heavy" font-size="24">DISPONIBLE</text>

    <rect x="101" y="1528" width="310" height="145" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="256" y="1594" class="base heavy" font-size="31">12:00</text>
    <text x="256" y="1637" class="green heavy" font-size="24">DISPONIBLE</text>

    <rect x="440" y="1528" width="310" height="145" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="595" y="1594" class="base heavy" font-size="31">12:30</text>
    <text x="595" y="1637" class="green heavy" font-size="24">DISPONIBLE</text>

    <rect x="101" y="1701" width="310" height="145" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="256" y="1767" class="base heavy" font-size="31">13:00</text>
    <text x="256" y="1810" class="green heavy" font-size="24">DISPONIBLE</text>

    <rect x="440" y="1701" width="310" height="145" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="595" y="1767" class="base heavy" font-size="31">13:30</text>
    <text x="595" y="1810" class="green heavy" font-size="24">DISPONIBLE</text>
