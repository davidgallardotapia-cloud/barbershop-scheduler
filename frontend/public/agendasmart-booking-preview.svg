    <text x="174" y="606" class="faded bold" font-size="28">Lun</text>
    <text x="174" y="659" class="faded heavy" font-size="44">04</text>

    <rect x="272" y="551" width="146" height="144" rx="22" fill="#ffffff" stroke="#dfe3ea" stroke-width="2"/>
    <text x="345" y="606" class="faded bold" font-size="28">Mar</text>
    <text x="345" y="659" class="faded heavy" font-size="44">05</text>

    <rect x="439" y="551" width="146" height="144" rx="22" fill="#ffffff" stroke="#dfe3ea" stroke-width="2"/>
    <text x="512" y="606" class="faded bold" font-size="28">Mi&#233;</text>
    <text x="512" y="659" class="faded heavy" font-size="44">06</text>

    <rect x="608" y="551" width="146" height="144" rx="22" fill="#ffffff" stroke="#dfe3ea" stroke-width="2"/>
    <text x="681" y="606" class="faded bold" font-size="28">Jue</text>
    <text x="681" y="659" class="faded heavy" font-size="44">07</text>

    <rect x="101" y="724" width="146" height="144" rx="22" fill="#ffffff" stroke="#dfe3ea" stroke-width="2"/>
    <text x="174" y="779" class="faded bold" font-size="28">Vie</text>
    <text x="174" y="832" class="faded heavy" font-size="44">08</text>

